# (Tanda 26) Declara dónde viven las funciones serverless de Netlify (send-email.js, que llama a
# Resend para mandar los mails con PDF adjunto). No hay paso de build: el sitio es un solo archivo
# HTML (sistema_de_limpiezas.html / index.html) servido tal cual.
[build]
  functions = "netlify/functions"
  publish = "."

# (Tanda 450) Las dos "AIza..." del index.html son claves WEB de Firebase (apiKey de firebaseConfig): son públicas por diseño -- viajan en el
# navegador de cualquiera -- y la seguridad de los datos la dan las reglas de Firestore, no esa clave. El escáner de secretos de Netlify las
# marca como "probable secreto" y hace fallar el deploy; con esto se le indica que las ignore (el resto del escaneo, incluida la clave de
# Resend, sigue activo).
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAno1K0dY3DpcTzkt1oiVLsAtW8rfqEocU,AIzaSyCfNMmtXTD6xM3x8FGALYaeL7G_kT6O1kQ"

# (Tanda 105 / ítem 3) send-birthday-emails.js revisa quién cumple años hoy y le manda el mail de
# felicitaciones. Ver el comentario al principio de ese archivo para la configuración que hace falta
# (variables de entorno nuevas, además de RESEND_API_KEY que ya existía desde la Tanda 26).
# (Tanda 108 / ítem 2) Antes corría UNA sola vez por día, a un horario fijo (03:01 UTC = 00:01hs
# Argentina). El problema: el scheduler de Netlify no garantiza que la función dispare justo a ese
# minuto -- puede correr con minutos (o más) de atraso, y en algún caso puntual directamente no
# disparar ese día. Como el usuario no quiere que el mail dependa de acertarle a un único horario --
# pidió que salga en cualquier momento del día a partir de las 00:01hs, cuanto más cerca de esa hora
# mejor, pero sin que se mande más de una vez -- ahora corre cada 15 minutos, TODO el día, todos los
# días. Esto es seguro porque la función YA se protegía sola contra el envío duplicado (ver
# `ch_cumpleemailenviado` / la variable `enviados` dentro de send-birthday-emails.js): si ya le mandó
# el mail a alguien este año, las corridas siguientes de ese mismo día la saltean sin hacer nada. Con
# 96 corridas por día en vez de 1, en el peor de los casos (que la corrida de las 00:01 en punto no
# dispare) el mail sale igual, como mucho 15 minutos más tarde -- nunca se manda dos veces.
[functions."send-birthday-emails"]
  schedule = "*/15 * * * *"

# (Tanda 116 / ítem 2) send-probation-alerts.js revisa a quién le pasaron 136 días desde su fecha de
# ingreso (1 mes y medio para terminar el período de prueba) y le manda un mail importante a Gerencia.
# Usa las MISMAS 3 variables de entorno que ya tiene configuradas send-birthday-emails.js
# (FIREBASE_CLIENT_EMAIL/FIREBASE_PRIVATE_KEY/RESEND_API_KEY) -- no hace falta cargar nada nuevo. A
# diferencia del cumpleaños (que solo aplica "hoy"), el umbral de 136 días sigue aplicando indefinidamente
# hasta que se manda el mail, así que alcanza con revisarlo una vez por día (no hace falta cada 15
# minutos) -- ver el comentario al principio de ese archivo para el detalle.
[functions."send-probation-alerts"]
  schedule = "1 3 * * *"

# (Tanda 106 / ítem 5) El acceso oculto a Admin pasó de "#admin" (hash) a "/copahueadmin" (path real,
# con una regla [[redirects]] acá para que Netlify no devolviera 404 al pedir esa ruta directamente).
# (Tanda 112 / ítem 1) Esa ruta "/copahueadmin" ya no existe -- el acceso oculto pasa a ser un gesto
# secreto dentro de la propia página (7 clicks rápidos sobre el logo de la pantalla de bienvenida, ver
# logoSecretClick() en el HTML), así que no hace falta ninguna regla de redirects para esto.
